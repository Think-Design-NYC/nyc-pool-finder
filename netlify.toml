# Netlify build + hosting config for https://pools.thinkdesign.com/
#
# Netlify's Git integration builds this repo on every push to `main` — including
# the automated "Refresh pool data" commits from scripts/refresh.sh, since the
# pool JSON is imported at build time rather than fetched at runtime.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The site is a single page with anchor-only navigation (#pool-…), so there is
# deliberately no SPA catch-all rewrite — unknown paths should 404, not 200.

# Old subpath URLs, in case anything links to pools.thinkdesign.com/pools/.
[[redirects]]
  from = "/pools/*"
  to = "/:splat"
  status = 301
  force = true

# Hashed Vite assets are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Data files are consumed by the mobile app and change daily — keep them fresh.
[[headers]]
  for = "/nyc_pools_*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
