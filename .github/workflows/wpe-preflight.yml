# TEMPORARY — Phase 1a preflight for the WP Engine migration.
# Deploys a tiny test directory to REMOTE_PATH pools/ so we can verify
# static serving at thinkdesign.com/pools/ before the real cutover.
# Delete this workflow in the cutover commit.
name: WPE preflight

on:
  workflow_dispatch:
    inputs:
      wpe_env:
        description: "WP Engine environment name"
        required: true
        type: string

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Build test content
        run: |
          mkdir -p preflight/nested
          echo '<!doctype html><title>preflight root</title><h1>preflight root ok</h1>' > preflight/index.html
          echo '<!doctype html><title>preflight nested</title><h1>preflight nested ok</h1>' > preflight/nested/index.html
          printf '{"preflight": true, "generated": "%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > preflight/test.json

      - name: Deploy to WP Engine
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ${{ inputs.wpe_env }}
          SRC_PATH: "preflight/"
          REMOTE_PATH: "pools/"
