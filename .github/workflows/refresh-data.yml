name: Refresh pool data

on:
  schedule:
    # Daily at 11:00 UTC (~6-7am New York).
    - cron: '0 11 * * *'
  workflow_dispatch:

# Needs write access to commit the refreshed JSON back to the repo.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Sanity check (guard against a broken scrape blanking the site)
        run: |
          count=$(python -c "import json; print(len(json.load(open('nyc_pools_live.json'))))")
          echo "Scraped $count pools"
          if [ "$count" -lt 20 ]; then
            echo "::error::Only $count pools scraped (<20). Refusing to commit — keeping last-good data."
            exit 1
          fi

      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- nyc_pools_live.json; then
            echo "No data changes."
          else
            git add nyc_pools_live.json
            git commit -m "Refresh pool data [automated]"
            git push
          fi
