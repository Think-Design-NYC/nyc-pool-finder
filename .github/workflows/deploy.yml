name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The site itself is built and published by Netlify's Git integration (see
# netlify.toml) — nothing in this workflow deploys it. All that's left here is
# the GitHub Pages redirect that keeps old indexed URLs alive.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Build must stay green: Netlify runs the same `npm run build`, and a failure
  # there is easy to miss on an automated data-refresh commit.
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

  # Keep GitHub Pages alive as a redirect so old indexed URLs don't 404.
  # The same page serves as index.html and 404.html; the script preserves
  # pool anchors (#pool-...) across the hop.
  deploy-pages-redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Build redirect page
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <title>NYC Indoor Pool Finder has moved</title>
              <link rel="canonical" href="https://pools.thinkdesign.com/" />
              <meta http-equiv="refresh" content="0; url=https://pools.thinkdesign.com/" />
              <script>location.replace('https://pools.thinkdesign.com/' + location.hash)</script>
            </head>
            <body>
              <p>NYC Indoor Pool Finder has moved to
                <a href="https://pools.thinkdesign.com/">pools.thinkdesign.com</a>.</p>
            </body>
          </html>
          HTML
          cp _site/index.html _site/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
