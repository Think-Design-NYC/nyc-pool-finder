<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>NYC Indoor Pool Finder — Open Now &amp; Lap Swim Schedules</title>
    <meta
      name="description"
      content="Find NYC indoor public pools open now — live lap swim, open swim &amp; family swim schedules for Manhattan, Brooklyn, Queens &amp; the Bronx. Updated daily."
    />
    <link rel="canonical" href="https://pools.thinkdesign.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="author" content="Think Design" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NYC Indoor Pool Finder" />
    <meta property="og:title" content="NYC Indoor Pool Finder — Open Now &amp; Lap Swim Schedules" />
    <meta
      property="og:description"
      content="Live schedules for all %POOL_COUNT% NYC Parks indoor public pools. %OPEN_COUNT% open now across Manhattan, Brooklyn, Queens &amp; the Bronx."
    />
    <meta property="og:url" content="https://pools.thinkdesign.com/" />
    <meta
      property="og:image"
      content="https://pools.thinkdesign.com/og-image.png"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NYC Indoor Pool Finder — Open Now &amp; Lap Swim Schedules" />
    <meta
      name="twitter:description"
      content="Live schedules for all %POOL_COUNT% NYC Parks indoor public pools. %OPEN_COUNT% open now."
    />
    <meta
      name="twitter:image"
      content="https://pools.thinkdesign.com/og-image.png"
    />

    <!-- og-image.png stays the social card; the favicon is the square PWA
         mark, since a 548x289 image squashes badly into a tab icon. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- iOS uses this for the home-screen label, not <title>, which is far too
         long to fit under an icon. -->
    <meta name="apple-mobile-web-app-title" content="Pool Finder" />
    <link rel="preconnect" href="https://www.nycgovparks.org" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
